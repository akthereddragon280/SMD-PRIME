name: Deploy Multi-Worker Load Balancer Architecture

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Stream Nodes to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Stream Node 1
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_1 }}
          accountId: ${{ secrets.CF_ACCOUNT_ID_1 }}
          command: deploy --config wrangler-1.toml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}

      - name: Deploy Stream Node 2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_2 }}
          accountId: ${{ secrets.CF_ACCOUNT_ID_2 }}
          command: deploy --config wrangler-2.toml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}

      - name: Deploy Stream Node 3
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_3 }}
          accountId: ${{ secrets.CF_ACCOUNT_ID_3 }}
          command: deploy --config wrangler-3.toml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}
