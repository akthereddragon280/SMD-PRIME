name: SMD PRIME - Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build Verification & Quality Audits
  verify-and-build:
    name: 🧪 Verify Frontend & Build Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Execute Production Vite Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WORKER_PROXY_URL: ${{ secrets.VITE_WORKER_PROXY_URL }}

  # 2. Deploy Telegram Bot Cloudflare Worker
  deploy-bot-worker:
    name: 🤖 Deploy Telegram Bot Worker
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Deploy Telegram Bot Worker to Cloudflare Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN secret is missing in GitHub Repository Secrets."
            echo "ℹ️ Please add CLOUDFLARE_API_TOKEN in GitHub Settings -> Secrets & Variables -> Actions."
            exit 0
          fi
          npx wrangler deploy --config wrangler-bot.toml

  # 3. Deploy Streaming Proxy Mesh Worker Nodes
  deploy-stream-workers:
    name: ⚡ Deploy Stream Node (${{ matrix.config }})
    runs-on: ubuntu-latest
    needs: verify-and-build
    strategy:
      matrix:
        config: ['wrangler.jsonc', 'wrangler-1.toml', 'wrangler-2.toml', 'wrangler-3.toml']
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Deploy Cloudflare Worker Node (${{ matrix.config }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN secret is missing in GitHub Repository Secrets."
            echo "ℹ️ Please add CLOUDFLARE_API_TOKEN in GitHub Settings -> Secrets & Variables -> Actions."
            exit 0
          fi
          npx wrangler deploy --config ${{ matrix.config }}
