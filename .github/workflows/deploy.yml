name: SMD PRIME - Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Build Verification & Quality Audits
  verify-and-build:
    name: 🧪 Verify Frontend & Build Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 🛠️ Execute Production Vite Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_WORKER_PROXY_URL: ${{ secrets.VITE_WORKER_PROXY_URL }}

  # 2. Deploy Telegram Bot Cloudflare Worker
  deploy-bot-worker:
    name: 🤖 Deploy Telegram Bot Worker
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 🚀 Deploy Telegram Bot Worker to Cloudflare Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN_1 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID_1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN / CF_API_TOKEN_1 secret is missing in GitHub Repository Secrets."
            echo "ℹ️ Please add CLOUDFLARE_API_TOKEN or CF_API_TOKEN_1 in GitHub Settings -> Secrets & Variables -> Actions."
            exit 0
          fi
          npx wrangler deploy --config wrangler-bot.toml

  # 3. Deploy Streaming Proxy Mesh Worker Nodes
  deploy-stream-workers:
    name: ⚡ Deploy Stream Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: verify-and-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'tgstream (wrangler.jsonc)'
            config: 'wrangler.jsonc'
            api_token: ${{ secrets.CF_API_TOKEN_1 || secrets.CLOUDFLARE_API_TOKEN }}
            account_id: ${{ secrets.CF_ACCOUNT_ID_1 || secrets.CLOUDFLARE_ACCOUNT_ID }}
          - name: 'smd-stream-node-1'
            config: 'wrangler-1.toml'
            api_token: ${{ secrets.CF_API_TOKEN_1 || secrets.CLOUDFLARE_API_TOKEN }}
            account_id: ${{ secrets.CF_ACCOUNT_ID_1 || secrets.CLOUDFLARE_ACCOUNT_ID }}
          - name: 'smd-stream-node-2'
            config: 'wrangler-2.toml'
            api_token: ${{ secrets.CF_API_TOKEN_2 || secrets.CF_API_TOKEN_1 || secrets.CLOUDFLARE_API_TOKEN }}
            account_id: ${{ secrets.CF_ACCOUNT_ID_2 || secrets.CF_ACCOUNT_ID_1 || secrets.CLOUDFLARE_ACCOUNT_ID }}
          - name: 'smd-stream-node-3'
            config: 'wrangler-3.toml'
            api_token: ${{ secrets.CF_API_TOKEN_3 || secrets.CF_API_TOKEN_1 || secrets.CLOUDFLARE_API_TOKEN }}
            account_id: ${{ secrets.CF_ACCOUNT_ID_3 || secrets.CF_ACCOUNT_ID_1 || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Modern Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 🚀 Deploy Cloudflare Worker Node (${{ matrix.name }})
        env:
          CLOUDFLARE_API_TOKEN: ${{ matrix.api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ matrix.account_id }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ Cloudflare API Token secret is missing for ${{ matrix.name }} in GitHub Repository Secrets."
            echo "ℹ️ Please verify CF_API_TOKEN_1 / CF_API_TOKEN_2 / CF_API_TOKEN_3 in GitHub Settings."
            exit 0
          fi
          npx wrangler deploy --config ${{ matrix.config }}
